<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI IELTS Speaking Lab</title>

<style>
:root {
    --bg-dark-blue: #0a192f;
    --bg-dark-green: #0d3b2e;
    --card-bg: #112240;
    --text-light-green: #64ffda;
    --text-yellow: #ffd700;
    --text-white: #ffffff;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: var(--text-white);
    text-align: center;
    padding: 15px;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
}

.container {
    max-width: 800px;
    margin: auto;
    width: 100%;
}

h1 {
    color: var(--text-yellow);
    margin-bottom: 5px;
    font-size: 1.8rem;
}

h3 {
    color: var(--text-light-green);
    margin-top: 0;
    font-weight: 400;
    font-size: 1rem;
}

.card {
    background: rgba(17, 34, 64, 0.85);
    padding: 20px;
    border-radius: 15px;
    margin-top: 15px;
    border: 1px solid rgba(100, 255, 218, 0.2);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    box-sizing: border-box;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 15px 0;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #00c6ff;
    color: #000;
    font-weight: bold;
    font-size: 0.95rem;
    transition: transform 0.1s, opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    background: #555 !important;
    color: #888 !important;
    cursor: not-allowed;
    transform: none;
    opacity: 0.6;
}

.btn-primary { background: var(--text-light-green); color: var(--bg-dark-blue); }
.btn-yellow { background: var(--text-yellow); color: #000; }
.btn-danger { background: #ff4d4d; color: #fff; }

.result {
    text-align: left;
    margin-top: 15px;
    background: rgba(0, 0, 0, 0.35);
    padding: 15px;
    border-radius: 10px;
    border-left: 4px solid var(--text-light-green);
}

.highlight {
    background: #ff5555;
    color: white;
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: bold;
}

#status {
    color: var(--text-yellow);
    font-style: italic;
    margin: 10px 0;
    min-height: 20px;
}

pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    color: var(--text-white);
}

#liveText {
    min-height: 40px;
    font-size: 1.1rem;
    line-height: 1.5;
    background: rgba(0, 0, 0, 0.2);
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
}

.interim-span {
    color: #aaa;
    font-style: italic;
}
</style>
</head>

<body>

<div class="container">
<h1>AI IELTS Speaking Lab</h1>
<h3>Prepared by Coach Carlos O.</h3>

<div class="card" id="startCard">
    <p>Practice all 18 IELTS Speaking prompts with live transcript, pronunciation analysis, and voice feedback.</p>
    <button class="btn-yellow" onclick="startExam()">🚀 Start Speaking Test</button>
</div>

<div id="app" class="card" style="display:none;"></div>
</div>

<script>
const questions = [
    "Do you enjoy learning English?",
    "What do you do in your free time?",
    "Describe a memorable journey you had.",
    "Why do people travel?",
    "What is your favorite place in your city?",
    "Do you think technology improves communication?",
    "What kind of music do you like and why?",
    "What are the advantages of learning a foreign language?",
    "Do you prefer mornings or evenings?",
    "What is your favorite food and why?",
    "How do you usually spend your weekends?",
    "Do you like working in teams?",
    "What is a skill you want to learn?",
    "Do you think social media is useful?",
    "What kind of movies do you enjoy?",
    "Describe your best friend.",
    "What do you usually do on holidays?",
    "Do you think learning English is difficult?"
];

let current = 0;
let transcript = "";
let finalTranscript = "";
let recognition = null;
let mediaRecorder = null;
let audioChunks = [];
let audioURL = null;
let persistentStream = null;
let isRecording = false;
let startTime, endTime;

let reviewTime = 30000;
let timer = null;
let paused = false;
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function startExam(){
    current = 0;
    document.getElementById("startCard").style.display = "none";
    document.getElementById("app").style.display = "block";
    loadQuestion();
}

function loadQuestion(){
    clearTimeout(timer);
    paused = false;

    if(current >= questions.length){
        finish();
        return;
    }

    transcript = "";
    finalTranscript = "";

    const app = document.getElementById("app");
    app.innerHTML = `
    <div style="font-size: 0.9rem; color: var(--text-light-green); text-align: left;">Question ${current + 1} of ${questions.length}</div>
    <h2 style="color: var(--text-yellow); margin-top: 5px;">Examiner:</h2>
    <p style="font-size: 1.3rem; font-weight: 600; margin-bottom: 20px;">"${questions[current]}"</p>

    <div class="btn-group">
        <button class="btn-primary" onclick="speakQuestion()">🔊 Listen</button>
        <button class="btn-primary" onclick="shadowMode()">🔁 Repeat After Me</button>
    </div>

    <div class="btn-group">
        <button id="recBtn" class="btn-yellow" onclick="toggleRecording()">🎤 Start Recording</button>
        <button id="playBtn" disabled onclick="playAudio()">🔊 Play My Voice</button>
        <button id="nextBtn" class="btn-primary" disabled onclick="analyze()">➡️ Submit Answer</button>
    </div>

    <audio id="audioPlayer" style="display:none;" playsinline></audio>

    <div id="status">Ready</div>

    <div class="result">
        <p style="margin-top:0; color:var(--text-yellow);"><b>Your Speech Transcript:</b></p>
        <div id="liveText">Click "Start Recording" and speak clearly...</div>
        <div id="feedback"></div>
    </div>
    `;
}

function speakText(text, rate) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate || 0.9;
    
    const voices = window.speechSynthesis.getVoices();
    const maleVoice = voices.find(v => v.lang.includes('en') && 
        (v.name.includes('Male') || v.name.includes('David') || v.name.includes('George') || v.name.includes('Natural US')));
    if (maleVoice) u.voice = maleVoice;

    window.speechSynthesis.speak(u);
}

function speakQuestion(){ speakText(questions[current], 0.9); }
function shadowMode(){ 
    speakText(questions[current], 0.75);
    document.getElementById("status").innerText = "Listen closely and repeat!";
}

async function toggleRecording(){
    if (!isRecording) await startRecording();
    else stopRecording();
}

async function startRecording(){
    try {
        finalTranscript = "";
        transcript = "";
        document.getElementById("liveText").innerHTML = '<span class="interim-span">Listening... Speak now.</span>';
        
        // Start text recognition FIRST to ensure it grabs the mobile mic focus
        startRecognition();

        // Slight delay before asking for MediaRecorder stream to prevent mobile mic conflicts
        await new Promise(resolve => setTimeout(resolve, 150));

        if (!persistentStream || !persistentStream.active) {
            persistentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        
        let options = {};
        if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
        else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
        else if (MediaRecorder.isTypeSupported('audio/aac')) options = { mimeType: 'audio/aac' };

        mediaRecorder = new MediaRecorder(persistentStream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.start(200);

        startTime = new Date();
        isRecording = true;

        const recBtn = document.getElementById("recBtn");
        recBtn.innerText = "⏹ Stop Recording";
        recBtn.classList.remove("btn-yellow");
        recBtn.classList.add("btn-danger");

        document.getElementById("status").innerText = "Recording...";
        document.getElementById("playBtn").disabled = true;
        document.getElementById("nextBtn").disabled = true;
    } catch(err) {
        alert("Microphone access denied. Please check your browser permissions.");
        console.error("Recording error:", err);
    }
}

function startRecognition(){
    if (!SpeechRecognition) {
        console.warn("Speech recognition not fully supported.");
        return;
    }

    if (recognition) {
        try { recognition.abort(); } catch(e){}
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = !isMobile; // Mobile browsers hate continuous mode
    recognition.interimResults = true;

    recognition.onresult = e => {
        let interim = "";
        finalTranscript = "";

        for (let i = 0; i < e.results.length; i++) {
            let t = e.results[i][0].transcript;
            if (e.results[i].isFinal) finalTranscript += t + " ";
            else interim += t;
        }

        transcript = (finalTranscript + interim).trim();

        const liveText = document.getElementById("liveText");
        if (liveText) {
            liveText.innerHTML = finalTranscript + (interim ? `<span class="interim-span">${interim}</span>` : "");
        }
    };

    recognition.onerror = e => {
        console.warn("Speech API Error:", e.error);
    };

    recognition.onend = () => {
        // Only loop on desktop. Mobile looping causes crashes/blocks.
        if (isRecording && !isMobile) {
            try { recognition.start(); } catch(e){}
        }
    };

    try { recognition.start(); } catch(e){}
}

function stopRecording(){
    isRecording = false;
    endTime = new Date();

    if (recognition) {
        try { recognition.stop(); } catch(e){}
    }

    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.onstop = () => {
            const mimeType = mediaRecorder.mimeType || 'audio/webm';
            const blob = new Blob(audioChunks, { type: mimeType });
            audioURL = URL.createObjectURL(blob);
            document.getElementById("audioPlayer").src = audioURL;

            document.getElementById("status").innerText = "Recording Saved!";
            document.getElementById("playBtn").disabled = false;
            document.getElementById("nextBtn").disabled = false;

            const recBtn = document.getElementById("recBtn");
            recBtn.innerText = "🎤 Record Again";
            recBtn.classList.remove("btn-danger");
            recBtn.classList.add("btn-yellow");

            // Graceful fallback for mobile users if transcript was blocked
            const liveText = document.getElementById("liveText");
            if (liveText && transcript) {
                liveText.innerText = transcript;
            } else if (liveText && !transcript) {
                liveText.innerHTML = "<span class='interim-span'>Audio saved successfully. (Note: Text transcription may be restricted on this mobile browser, but you can still play your voice back and submit).</span>";
            }
        };
    }
}

function playAudio(){
    const player = document.getElementById("audioPlayer");
    if (!player.src) return;
    player.currentTime = 0;
    player.play();
    document.getElementById("status").innerText = "Playing back your voice...";
}

function highlightErrors(text){
    if (!text) return "Audio captured.";
    let fillers = ["um", "uh", "like", "you know"];
    let words = text.split(/\s+/);
    return words.map((w, i) => {
        let cleanWord = w.toLowerCase().replace(/[^a-z]/g, "");
        if (fillers.includes(cleanWord)) return `<span class="highlight">${w}</span>`;
        if (i > 0 && cleanWord === words[i-1].toLowerCase().replace(/[^a-z]/g, "")) return `<span class="highlight">${w}</span>`;
        return w;
    }).join(" ");
}

function analyze(){
    clearTimeout(timer);
    
    let words = transcript ? transcript.trim().split(/\s+/).filter(w => w.length > 0).length : 0;
    let duration = (endTime - startTime) ? (endTime - startTime) / 1000 : 1;
    let speed = words ? Math.round(words / (duration / 60)) : 0;

    if (transcript) {
        document.getElementById("liveText").innerHTML = highlightErrors(transcript);
    }

    let feedbackText = "";
    if (words > 0) {
        let weak = words < 8;
        feedbackText = 
`Band Estimate: ${speed > 120 ? "7.0 - 8.0" : speed > 90 ? "5.5 - 6.5" : "4.0 - 5.0"}
Words Spoken: ${words}
Speech Duration: ${duration.toFixed(1)} sec
Speaking Rate: ${speed} WPM
Response Depth: ${weak ? "Needs Elaboration" : "Sufficient Length"}
Teacher Tip: Keep your pace natural and avoid pauses.`;
    } else {
        feedbackText = 
`Speech Duration: ${duration.toFixed(1)} sec
Audio successfully recorded. 
Teacher Tip: Ensure you are speaking clearly. If text didn't appear, your mobile browser may limit simultaneous live transcription. Listen to your audio playback to review your fluency!`;
    }

    document.getElementById("feedback").innerHTML = `
        <pre>${feedbackText}</pre>
        <div class="btn-group">
            <button class="btn-primary" onclick="togglePause()">⏸ Pause / Resume Auto-Next</button>
            <button class="btn-yellow" onclick="downloadFeedback()">📝 Download Feedback</button>
        </div>
    `;

    document.getElementById("status").innerText = "Review your feedback (30s auto-advance)...";

    timer = setTimeout(() => { current++; loadQuestion(); }, reviewTime);
}

function togglePause(){
    if (!paused) {
        clearTimeout(timer);
        document.getElementById("status").innerText = "Paused auto-advance.";
        paused = true;
    } else {
        document.getElementById("status").innerText = "Resuming (advancing in 5s)...";
        paused = false;
        timer = setTimeout(() => { current++; loadQuestion(); }, 5000);
    }
}

function downloadFeedback(){
    let text = "IELTS Question: " + questions[current] + "\n\n" + 
               "Transcript: " + (transcript || "[Audio captured but transcription blocked by browser]") + "\n\n" + 
               document.getElementById("feedback").innerText;
    let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `IELTS_Q${current + 1}_Feedback.txt`;
    link.click();
}

function finish(){
    if (persistentStream) {
        persistentStream.getTracks().forEach(track => track.stop());
        persistentStream = null;
    }
    document.getElementById("app").innerHTML = `
        <h2 style="color:var(--text-yellow);">🎉 Test Completed!</h2>
        <p style="font-size:1.2rem;">Outstanding effort! You have completed all 18 practice tasks.</p>
        <button class="btn-yellow" onclick="startExam()">🔄 Restart Test</button>
    `;
}
</script>
</body>
</html>
